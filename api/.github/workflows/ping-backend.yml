name: Ping Backend Regularly

on:
  schedule:
    # Runs every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: # lets you run manually from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Backend API
        run: |
          echo "🚀 Sending request to backend..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" "https://jigyasa-api.onrender.com/api/health")
          echo "✅ Response from backend:"
          echo "$RESPONSE"
